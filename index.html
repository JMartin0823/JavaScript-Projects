<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asian food app</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="index.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <main>
        <form class="checkout hide" onsubmit="return handleSubmit(event)">
            <h1>Enter card details</h1>
            <div class="input-fields">
                <input type="text" id="nameInput" placeholder="Enter your name" required>
                <input type="number" placeholder="Enter card number" required>
                <input type="number" placeholder="Enter CVV" required>
            </div>
            <input type="submit" value="Complete order" class="submit"></input>
        </form>
        <div id="main-container">
            <div class="header">
                
            </div>
            <div id="items-container">

            </div>
            <div id="order-container">

            </div>
        </div>
    </main>
    <script src="index.js" type="module"></script>
</body>
</html>
